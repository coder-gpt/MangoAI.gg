<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Luau AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1e293b; padding: 1rem; text-align: center; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; color: #38bdf8; }
    #key-input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 0.8rem; width: 220px; }
    #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .message { max-width: 80%; padding: 0.75rem 1rem; border-radius: 8px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
    .user { align-self: flex-end; background-color: #0284c7; color: white; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    pre { background: #090d16; padding: 0.75rem; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 0.85rem; margin-top: 0.5rem; position: relative; border: 1px solid #1e293b; }
    code { color: #a5f3fc; }
    .copy-btn { position: absolute; top: 6px; right: 6px; background: #334155; color: #fff; border: none; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; }
    .copy-btn:hover { background: #0284c7; }
    #input-form { display: flex; padding: 1rem; background-color: #1e293b; gap: 0.5rem; border-top: 1px solid #334155; }
    #user-input { flex: 1; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: white; outline: none; }
    #user-input:focus { border-color: #0284c7; }
    button[type="submit"] { padding: 0.75rem 1.5rem; background-color: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button[type="submit"]:hover { background-color: #0369a1; }
  </style>
</head>
<body>
  <header>
    <h1>Roblox Luau AI Assistant</h1>
    <input type="password" id="key-input" placeholder="Paste OpenAI Key (sk-...)" />
  </header>
  <div id="chat-container">
    <div class="message ai">Hello! Enter your OpenAI API key in the top right, then ask me to write any Roblox Luau script.</div>
  </div>
  <form id="input-form">
    <input type="text" id="user-input" placeholder="e.g., Write a leaderboard script that gives coins..." required />
    <button type="submit">Send</button>
  </form>

  <script>
    const c = document.getElementById("chat-container");
    const f = document.getElementById("input-form");
    const i = document.getElementById("user-input");
    const keyInput = document.getElementById("key-input");

    // Load saved API key from localStorage
    if (localStorage.getItem("openai_key")) {
      keyInput.value = localStorage.getItem("openai_key");
    }

    keyInput.addEventListener("change", () => {
      localStorage.setItem("openai_key", keyInput.value.trim());
    });

    function appendMessage(txt, sender) {
      const m = document.createElement("div");
      m.classList.add("message", sender);
      if (sender === "ai") {
        m.innerHTML = txt.replace(/```(lua|luau)?([\s\S]*?)```/g, (_, __, code) => {
          return `<pre><code>${escapeHtml(code.trim())}</code><button class="copy-btn" onclick="copyCode(this)">Copy</button></pre>`;
        });
      } else {
        m.textContent = txt;
      }
      c.appendChild(m);
      c.scrollTop = c.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.copyCode = function(b) {
      navigator.clipboard.writeText(b.previousElementSibling.textContent);
      b.textContent = "Copied!";
      setTimeout(() => b.textContent = "Copy", 2000);
    };

    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const apiKey = keyInput.value.trim();
      if (!apiKey) {
        alert("Please enter an OpenAI API key in the top right input field.");
        return;
      }

      const p = i.value.trim();
      if (!p) return;

      appendMessage(p, "user");
      i.value = "";

      const l = document.createElement("div");
      l.classList.add("message", "ai");
      l.textContent = "Generating Luau code...";
      c.appendChild(l);

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: "You are an expert Roblox Luau coding assistant. Provide concise explanations and modern Luau code blocks using task.wait, game:GetService, and local scope." },
              { role: "user", content: p }
            ]
          })
        });

        const data = await response.json();
        c.removeChild(l);

        if (data.choices && data.choices[0] && data.choices[0].message) {
          appendMessage(data.choices[0].message.content, "ai");
        } else {
          appendMessage(`Error: ${data.error?.message || "Invalid response."}`, "ai");
        }
      } catch (err) {
        c.removeChild(l);
        appendMessage("Network error connecting to API.", "ai");
      }
    });
  </script>
</body>
</html>
