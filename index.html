<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalkUp</title>
  <style>
    :root {
      --bg-dark: #1e1f22;
      --bg-sidebar: #2b2d31;
      --bg-chat: #313338;
      --accent: #5865f2;
      --text: #f2f3f5;
      --text-muted: #949ba4;
      --danger: #da373c;
      --role-owner: #f1c40f;
      --role-admin: #e74c3c;
      --role-member: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* Auth Screen */
    #auth-screen { position: absolute; inset: 0; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .auth-card { background: var(--bg-sidebar); padding: 32px; border-radius: 8px; width: 380px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
    .auth-card input, .auth-card select { padding: 10px; background: var(--bg-dark); border: 1px solid #4e5058; color: #fff; border-radius: 4px; }
    .btn { padding: 10px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn:hover { opacity: 0.9; }

    /* Main App Layout */
    #app { display: flex; width: 100vw; height: 100vh; }
    .hidden { display: none !important; }

    /* Sidebar Column */
    .servers-bar { width: 72px; background: #111214; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 12px; }
    .server-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-sidebar); display: flex; align-items: center; justify-content: center; cursor: pointer; background-size: cover; background-position: center; transition: 0.2s; position: relative; }
    .server-icon:hover { border-radius: 16px; background-color: var(--accent); }

    /* Channels & Chat Area */
    .sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; }
    .sidebar-header { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: bold; }
    .chat-area { flex: 1; background: var(--bg-chat); display: flex; flex-direction: column; }
    .chat-header { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: bold; }
    
    /* Messages Stream */
    .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message-item { display: flex; flex-direction: column; gap: 4px; }
    .message-author { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .message-text { font-size: 15px; color: var(--text); }
    .chat-input-area { padding: 16px; background: var(--bg-chat); display: flex; gap: 8px; }
    .chat-input-area input { flex: 1; padding: 12px; background: #383a40; border: none; color: #fff; border-radius: 8px; outline: none; }

    /* Role Badges */
    .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; color: #fff; }
    .role-owner { background: var(--role-owner); color: #000; }
    .role-admin { background: var(--role-admin); }
    .role-member { background: var(--role-member); }

    /* Modals */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal { background: var(--bg-sidebar); padding: 24px; border-radius: 8px; width: 400px; display: flex; flex-direction: column; gap: 16px; }
    .modal input, .modal select { padding: 8px; background: var(--bg-dark); border: 1px solid #4e5058; color: #fff; border-radius: 4px; }
    
    /* Settings */
    .settings-container { display: flex; width: 100%; height: 100%; background: var(--bg-chat); }
    .settings-nav { width: 200px; background: var(--bg-sidebar); padding: 20px 10px; display: flex; flex-direction: column; gap: 8px; }
    .settings-nav button { background: none; border: none; color: var(--text-muted); padding: 8px 12px; text-align: left; cursor: pointer; border-radius: 4px; }
    .settings-nav button.active, .settings-nav button:hover { background: #3f4248; color: #fff; }
    .settings-content { flex: 1; padding: 40px; overflow-y: auto; }
    .setting-group { margin-bottom: 24px; }
    .setting-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN (CODE ONLY ACCESS) -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>TalkUp Code Access</h2>
      <p style="font-size: 13px; color: var(--text-muted);">Enter your Access/Invite Code to sign up</p>
      <input type="text" id="access-code-input" placeholder="Access Code (e.g. TALKUP2026)">
      <input type="text" id="user-display-name" placeholder="Display Name">
      <select id="user-role-select">
        <option value="Member">Member Role</option>
        <option value="Admin">Admin Role</option>
        <option value="Owner">Owner Role</option>
      </select>
      <button class="btn" onclick="signUpWithCode()">Join TalkUp</button>
      <p id="auth-error" style="color: var(--danger); font-size: 13px;" class="hidden">Please enter a valid Access Code & Name.</p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">
    <!-- Server List Sidebar -->
    <div class="servers-bar">
      <div class="server-icon" onclick="showChat()">💬</div>
      <div id="custom-servers" style="display:flex; flex-direction:column; gap:12px;"></div>
      <div class="server-icon" onclick="openCreateServerModal()">+</div>
      <div class="server-icon" style="margin-top:auto; margin-bottom:12px;" onclick="openSettings()">⚙️</div>
    </div>

    <!-- Chat Area -->
    <div id="chat-view" style="display:flex; flex:1;">
      <div class="sidebar">
        <div class="sidebar-header">
          <span id="server-title">TalkUp HQ</span>
        </div>
      </div>
      <div class="chat-area">
        <div class="chat-header">
          <h3 id="channel-title"># general</h3>
        </div>
        <div class="messages-container" id="messages-container"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Message #general..." onkeypress="handleKeyPress(event)">
          <button class="btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="settings-view" class="settings-container hidden">
      <div class="settings-nav">
        <button class="tab-btn active" onclick="switchTab('account')">Account & Role</button>
        <button class="tab-btn" onclick="switchTab('developer')">Developer Mode</button>
        <button style="color: var(--danger); margin-top: auto;" onclick="closeSettings()">Esc / Close</button>
      </div>
      <div class="settings-content">
        <!-- Account Tab -->
        <div id="tab-account" class="tab-content">
          <h2>Account & Role Settings</h2>
          <br>
          <div class="setting-group">
            <label>Display Name</label>
            <input type="text" id="settings-username" style="padding:8px; width:250px;">
          </div>
          <div class="setting-group">
            <label>Assigned Role</label>
            <select id="settings-role" style="padding:8px; background:var(--bg-dark); color:#fff;" onchange="updateRole()">
              <option value="Member">Member</option>
              <option value="Admin">Admin</option>
              <option value="Owner">Owner</option>
            </select>
          </div>
        </div>

        <!-- Developer Tab -->
        <div id="tab-developer" class="tab-content hidden">
          <h2>Developer Mode</h2>
          <br>
          <div id="dev-lock">
            <p style="margin-bottom:12px; color:var(--text-muted);">Enter passcode to access Developer Features:</p>
            <input type="password" id="dev-code-input" placeholder="Enter Access Code" style="padding:8px;">
            <button class="btn" onclick="unlockDeveloperMode()">Unlock</button>
            <p id="dev-error" style="color:var(--danger); margin-top:8px;" class="hidden">Invalid Code!</p>
          </div>
          <div id="dev-unlocked" class="hidden">
            <p style="color: #23a55a; margin-bottom: 16px;">✓ Developer Mode Enabled</p>
            <div class="setting-group">
              <label><input type="checkbox" checked> Enable Live Event Broadcast</label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CREATE SERVER MODAL -->
  <div id="create-server-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Create Your Server</h3>
      <input type="text" id="server-name-input" placeholder="Server Name">
      <div>
        <label style="font-size: 12px; color: var(--text-muted); display:block; margin-bottom:4px;">Server Picture (URL or File Upload)</label>
        <input type="text" id="server-img-url" placeholder="Image URL" style="width: 100%; margin-bottom: 8px;">
        <input type="file" id="server-img-file" accept="image/*" onchange="handleFileSelect(event)">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" style="background:transparent;" onclick="closeCreateServerModal()">Cancel</button>
        <button class="btn" onclick="createNewServer()">Create</button>
      </div>
    </div>
  </div>

  <script>
    const ENCODED_DEV_CODE = "REVWNDdMSUZF"; 
    const chatChannel = new BroadcastChannel('talkup_chat_channel');

    let currentUser = { name: "User", role: "Member" };
    let tempImageData = "";

    // REAL-TIME MESSAGING SYNC ACROSS TABS
    chatChannel.onmessage = (event) => {
      appendMessageUI(event.data);
    };

    // Code-Only Sign Up Functionality
    function signUpWithCode() {
      const code = document.getElementById('access-code-input').value.trim();
      const name = document.getElementById('user-display-name').value.trim() || "User";
      const role = document.getElementById('user-role-select').value;

      if (!code) {
        document.getElementById('auth-error').classList.remove('hidden');
        return;
      }

      currentUser.name = name;
      currentUser.role = role;

      document.getElementById('settings-username').value = currentUser.name;
      document.getElementById('settings-role').value = currentUser.role;

      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    // Message Handling
    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const messageData = {
        author: currentUser.name,
        role: currentUser.role,
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      // Broadcast to other tabs & render locally
      chatChannel.postMessage(messageData);
      appendMessageUI(messageData);

      input.value = "";
    }

    function appendMessageUI(data) {
      const container = document.getElementById('messages-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message-item';

      const roleClass = `role-${data.role.toLowerCase()}`;

      msgDiv.innerHTML = `
        <div class="message-author">
          ${data.author}
          <span class="role-badge ${roleClass}">${data.role}</span>
          <span style="font-size: 11px; color: var(--text-muted); font-weight: normal;">${data.timestamp}</span>
        </div>
        <div class="message-text">${data.text}</div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function updateRole() {
      currentUser.role = document.getElementById('settings-role').value;
    }

    // Modal Control & Server Creation
    function openCreateServerModal() { document.getElementById('create-server-modal').classList.remove('hidden'); }
    function closeCreateServerModal() { 
      document.getElementById('create-server-modal').classList.add('hidden');
      tempImageData = "";
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) { tempImageData = evt.target.result; };
        reader.readAsDataURL(file);
      }
    }

    function createNewServer() {
      const name = document.getElementById('server-name-input').value || "New Server";
      const urlInput = document.getElementById('server-img-url').value;
      const imgSrc = urlInput || tempImageData;

      const serverIcon = document.createElement('div');
      serverIcon.className = 'server-icon';
      
      if (imgSrc) {
        serverIcon.style.backgroundImage = `url('${imgSrc}')`;
      } else {
        serverIcon.innerText = name.charAt(0).toUpperCase();
      }

      serverIcon.onclick = () => {
        showChat();
        document.getElementById('server-title').innerText = name;
      };

      document.getElementById('custom-servers').appendChild(serverIcon);
      closeCreateServerModal();
    }

    // View & Settings Navigation
    function openSettings() {
      document.getElementById('chat-view').classList.add('hidden');
      document.getElementById('settings-view').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settings-view').classList.add('hidden');
      document.getElementById('chat-view').classList.remove('hidden');
    }

    function showChat() { closeSettings(); }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      event.target.classList.add('active');
    }

    function unlockDeveloperMode() {
      const inputCode = document.getElementById('dev-code-input').value;
      if (btoa(inputCode) === ENCODED_DEV_CODE) {
        document.getElementById('dev-lock').classList.add('hidden');
        document.getElementById('dev-unlocked').classList.remove('hidden');
        document.getElementById('dev-error').classList.add('hidden');
      } else {
        document.getElementById('dev-error').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
