<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#383a40"/>
      <stop offset="100%" stop-color="#1e1f22"/>
    </radialGradient>

    <!-- TalkUp Brand Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#313338"/>
      <stop offset="100%" stop-color="#232428"/>
    </linearGradient>

    <linearGradient id="brandGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#23a55a"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- PS5 Controller Body Base -->
  <g transform="translate(0, 20)">
    <!-- Main Shell -->
    <path d="M 260 140 C 320 130, 480 130, 540 140 C 580 145, 620 180, 640 230 C 670 310, 690 420, 650 470 C 630 495, 580 480, 540 410 C 510 360, 470 345, 400 345 C 330 345, 290 360, 260 410 C 220 480, 170 495, 150 470 C 110 420, 130 310, 160 230 C 180 180, 220 145, 260 140 Z" 
          fill="url(#bodyGrad)" stroke="#4e5058" stroke-width="4"/>

    <!-- Inner Ergonomic Grips -->
    <path d="M 230 190 C 290 180, 510 180, 570 190 C 600 240, 625 350, 610 440 C 600 455, 575 440, 545 390 C 510 330, 460 325, 400 325 C 340 325, 290 330, 255 390 C 225 440, 200 455, 190 440 C 175 350, 200 240, 230 190 Z" 
          fill="#1e1f22" opacity="0.9"/>

    <!-- TalkUp LED Glow Strip -->
    <path d="M 280 170 C 330 162, 470 162, 520 170 C 550 200, 570 270, 555 350" 
          fill="none" stroke="url(#brandGlow)" stroke-width="5" filter="url(#neonGlow)" opacity="0.85"/>
    <path d="M 520 170 C 470 162, 330 162, 280 170 C 250 200, 230 270, 245 350" 
          fill="none" stroke="url(#brandGlow)" stroke-width="5" filter="url(#neonGlow)" opacity="0.85"/>

    <!-- Touchpad (Center Screen Area) -->
    <rect x="310" y="160" width="180" height="110" rx="12" fill="#2b2d31" stroke="#5865f2" stroke-width="2"/>

    <!-- Touchpad TalkUp Branding -->
    <g transform="translate(400, 215)">
      <!-- Speech Bubble Logo -->
      <path d="M -25 -15 C -40 -15, -50 -5, -50 10 C -50 20, -42 28, -30 32 C -33 40, -40 45, -42 46 C -40 46, -28 44, -20 34 C -17 35, -13 35, -10 35 C 5 35, 15 25, 15 10 C 15 -5, 5 -15, -10 -15 Z" 
            fill="url(#brandGlow)" transform="scale(0.7) translate(15, -5)"/>
      <text x="0" y="8" fill="#ffffff" font-family="'Helvetica Neue', sans-serif" font-weight="bold" font-size="16" text-anchor="middle" letter-spacing="1">TALKUP</text>
    </g>

    <!-- D-Pad (Left Side) -->
    <g transform="translate(220, 230)">
      <path d="M -12 -35 L 12 -35 L 12 -12 L 35 -12 L 35 12 L 12 12 L 12 35 L -12 35 L -12 12 L -35 12 L -35 -12 L -12 -12 Z" fill="#2b2d31" stroke="#3f4147" stroke-width="2"/>
      <!-- Arrows -->
      <polygon points="0,-28 -7,-18 7,-18" fill="#dbdee1"/>
      <polygon points="0,28 -7,18 7,18" fill="#dbdee1"/>
      <polygon points="-28,0 -18,-7 -18,7" fill="#dbdee1"/>
      <polygon points="28,0 18,-7 18,7" fill="#dbdee1"/>
    </g>

    <!-- Action Buttons (Right Side) -->
    <g transform="translate(580, 230)">
      <!-- Triangle / Mic -->
      <circle cx="0" cy="-26" r="11" fill="#2b2d31" stroke="#23a55a" stroke-width="2"/>
      <text x="0" y="-22" fill="#23a55a" font-size="10" font-weight="bold" text-anchor="middle">▲</text>
      
      <!-- Square / Chat -->
      <circle cx="-26" cy="0" r="11" fill="#2b2d31" stroke="#5865f2" stroke-width="2"/>
      <text x="-26" y="4" fill="#5865f2" font-size="10" font-weight="bold" text-anchor="middle">■</text>

      <!-- Circle / Status -->
      <circle cx="26" cy="0" r="11" fill="#2b2d31" stroke="#f0b232" stroke-width="2"/>
      <text x="26" y="4" fill="#f0b232" font-size="10" font-weight="bold" text-anchor="middle">●</text>

      <!-- Cross / Leave -->
      <circle cx="0" cy="26" r="11" fill="#2b2d31" stroke="#f23f43" stroke-width="2"/>
      <text x="0" y="30" fill="#f23f43" font-size="10" font-weight="bold" text-anchor="middle">✖</text>
    </g>

    <!-- Thumbsticks -->
    <!-- Left Stick -->
    <circle cx="330" cy="330" r="38" fill="#1e1f22" stroke="#3f4147" stroke-width="3"/>
    <circle cx="330" cy="330" r="30" fill="#2b2d31"/>
    <circle cx="330" cy="330" r="22" fill="#1e1f22" stroke="#5865f2" stroke-width="1"/>

    <!-- Right Stick -->
    <circle cx="470" cy="330" r="38" fill="#1e1f22" stroke="#3f4147" stroke-width="3"/>
    <circle cx="470" cy="330" r="30" fill="#2b2d31"/>
    <circle cx="470" cy="330" r="22" fill="#1e1f22" stroke="#23a55a" stroke-width="1"/>

    <!-- Home Button (TalkUp Icon) -->
    <circle cx="400" cy="295" r="14" fill="#1e1f22" stroke="#5865f2" stroke-width="2" filter="url(#neonGlow)"/>
    <path d="M 394 290 Q 400 284 406 290 Q 408 296 402 300 L 396 302 Z" fill="#5865f2"/>
  </g>
</svg>
